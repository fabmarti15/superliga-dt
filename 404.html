<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#2f4a2c">
  <title>Página no encontrada · Súper Liga</title>
  <style>
    :root{color-scheme:light;--ink:#141a15;--paper:#f2ede0;--pitch:#2f4a2c;--gold:#f2b807}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:19px/1.55 Georgia,serif;padding:24px}
    main{width:min(100%,680px);border-top:6px solid var(--pitch);padding:clamp(24px,6vw,48px) 0}
    .brand{font:700 20px/1.2 Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--pitch);margin:0 0 44px}
    .code{font:700 clamp(72px,20vw,128px)/1 Impact,"Arial Narrow",sans-serif;color:var(--pitch);margin:0}
    h1{font:700 clamp(30px,8vw,48px)/1.12 Impact,"Arial Narrow",sans-serif;text-transform:uppercase;margin:14px 0 18px;overflow-wrap:anywhere}
    p{max-width:42ch}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:16px;padding:12px 22px;background:var(--gold);color:var(--ink);font:700 19px/1.3 Arial,sans-serif;text-decoration:none;border:2px solid var(--ink);border-radius:2px}
    a:focus-visible{outline:3px solid var(--pitch);outline-offset:5px}
  </style>
</head>
<body>
  <main>
    <p class="brand">Súper Liga · Donde tú eres el DT</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página no está disponible</h1>
    <p>Puedes volver al sitio de Súper Liga para conocer el juego, leer el reglamento o consultar su disponibilidad.</p>
    <a href="https://superligadt.com/">Volver a Súper Liga</a>
  </main>
</body>
</html>
